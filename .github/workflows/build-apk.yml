name: Publish Bush VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore and Xray-core (libv2ray.aar)
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          mkdir -p app/libs
          python3 - << 'EOF'
          import urllib.request, zipfile, io, os
          url = "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          data = urllib.request.urlopen(req, timeout=60).read()
          keep = {
              "AndroidManifest.xml",
              "classes.jar",
              "R.txt",
              "proguard.txt",
              "jni/arm64-v8a/libgojni.so"
          }
          with zipfile.ZipFile(io.BytesIO(data), "r") as zin:
              with zipfile.ZipFile("app/libs/libv2ray.aar", "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for item in zin.infolist():
                      if item.filename in keep:
                          zout.writestr(item, zin.read(item.filename))
          print("Prepared app/libs/libv2ray.aar:", os.path.getsize("app/libs/libv2ray.aar"))
          EOF

      - name: Build Bush VPN v2.0 APK
        run: |
          gradle assembleDebug --no-daemon
          cp -f app/build/outputs/apk/debug/app-debug.apk Bush-VPN.apk
          ls -lh Bush-VPN.apk

      - name: Commit updated Bush-VPN.apk v2.0 to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Bush-VPN.apk
          git diff --staged --quiet || (git commit -m "chore: update Bush-VPN.apk to v2.0 [skip ci]" && git push)

      - name: Upload Bush-VPN.apk to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bush-VPN-APK
          path: Bush-VPN.apk

      - name: Publish Bush-VPN.apk v2.0 to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Bush VPN v2.0 (Xray-core Android APK)"
          body: "Нажми на **Bush-VPN.apk** ниже в разделе Assets, чтобы скачать и установить обновлённое приложение **Bush VPN v2.0** (с рабочим ядром Xray-core и исправленным распознаванием стран)."
          files: Bush-VPN.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
