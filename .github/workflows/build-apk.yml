name: Build & Release Bush VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Bush VPN Debug APK
        run: gradle assembleDebug

      - name: Copy APK to Bush-VPN.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk Bush-VPN.apk

      - name: Upload Bush-VPN.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bush-VPN-APK
          path: Bush-VPN.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-bush
          name: "Bush VPN 👊 (Latest APK)"
          body: "Прямое скачивание готового установочного файла **Bush-VPN.apk** для Android (VLESS / REALITY / X-Ray)."
          files: Bush-VPN.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
