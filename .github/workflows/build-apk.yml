name: Publish Bush VPN APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Bush-VPN.apk to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bush-VPN-APK
          path: Bush-VPN.apk

      - name: Publish Bush-VPN.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Bush VPN v2.0 (Xray-core Android APK)"
          body: "Нажми на **Bush-VPN.apk** ниже в разделе Assets, чтобы скачать и установить обновлённое приложение Bush VPN v2.0 (с рабочим ядром Xray-core и исправленным распознаванием стран)."
          files: Bush-VPN.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
