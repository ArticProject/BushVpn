name: Publish Bush VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble & Sign Bush VPN v2.0 APK (with Native Xray-Core v26)
        run: |
          set -e
          echo "Downloading AndroidLibXrayLite v26.10.31 native Xray-core..."
          curl -L -sS -o /tmp/libv2ray.aar "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"

          python3 scripts/assemble_v2_apk.py

          BT_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using build-tools: $BT_DIR"

          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > /tmp/debug.keystore
          else
            cp debug.keystore /tmp/debug.keystore
          fi

          "$BT_DIR/zipalign" -p -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          "$BT_DIR/apksigner" sign \
            --ks /tmp/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out Bush-VPN.apk \
            /tmp/aligned.apk

          cp -f Bush-VPN.apk Bush-VPN-v2.0.apk
          "$BT_DIR/aapt2" dump badging Bush-VPN-v2.0.apk | head -n 5
          ls -lh Bush-VPN.apk Bush-VPN-v2.0.apk

      - name: Commit Bush-VPN-v2.0.apk and Bush-VPN.apk to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Bush-VPN.apk Bush-VPN-v2.0.apk
          if ! git diff --staged --quiet; then
            git commit -m "Publish Bush-VPN-v2.0.apk and update Bush-VPN.apk to v2.0 [skip ci]"
            git push
          fi

      - name: Publish Bush-VPN-v2.0.apk to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: "Bush VPN v2.0 (Latest APK — Xray-Core v26)"
          body: |
            ### 📥 Скачать Bush VPN v2.0 для Android
            Нажмите на **`Bush-VPN-v2.0.apk`** ниже в разделе **Assets**, чтобы скачать и установить актуальную версию **2.0**.

            **Что нового в v2.0:**
            - ✅ **Настоящий движок Xray-Core v26 (`libv2ray`):** Реальное туннелирование трафика через `VpnService` + `TUN`.
            - ✅ **Исправлено отображение стран и названий серверов в подписках:** Автоматическое распознавание всех флагов стран Unicode (`🇩🇪`, `🇳🇱`, `🇺🇸`, `🇫🇮`, `🇬🇧`, `🇫🇷`, `🇹🇷`, `🇰🇿` и 40+ стран) и точное отображение названий узлов из подписки (`KosmoVPN` и др.) вместо одинаковых «Финляндия».
            - ✅ **Живой фоновый TCP-пинг:** Автоматическая проверка реальной задержки серверов.
          files: |
            Bush-VPN-v2.0.apk
            Bush-VPN.apk
          prerelease: false
          make_latest: true
